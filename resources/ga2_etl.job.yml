# Deliverable 3.3: one pipeline, the city is the parameter. No compute is declared, so tasks run on serverless
# (the only compute on Databricks Free Edition).
resources:
  jobs:
    ga2_etl:
      name: ga2_etl
      description: "Load, clean and transform one city: volume -> bronze -> silver -> gold metrics -> features."
      max_concurrent_runs: 1
      parameters:
        - name: city
          default: A_Geneva

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            base_parameters:
              cities: "{{job.parameters.city}}"

        - task_key: bronze
          depends_on: [{task_key: setup}]
          notebook_task:
            notebook_path: ../notebooks/pipeline/01_bronze_ingest.py

        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/pipeline/02_silver_listings.py

        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/pipeline/03_gold_metrics.py

        - task_key: features
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/pipeline/04_features.py
